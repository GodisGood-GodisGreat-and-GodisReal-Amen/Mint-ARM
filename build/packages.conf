# Linux Mint ARM package selection.
# The starting point is the package manifest of the original Linux Mint 22.3 Cinnamon ISO
# (casper/filesystem.manifest). Lines are package names or shell-style globs; '#' starts a comment.

[drop-x86]
# x86-only hardware support and the BIOS/x86 boot chain
amd64-microcode intel-microcode iucode-tool thermald
grub-pc grub-pc-bin grub-efi-amd64* grub-gfxpayload-lists syslinux syslinux-utils
i965-va-driver intel-media-va-driver libigdgmm12 libvpl2 libipt2 libquadmath0 libxatracker2 libdrm-intel1
xserver-xorg-video-intel xserver-xorg-video-vmware xserver-xorg-video-qxl xserver-xorg-video-all
xserver-xorg-video-amdgpu xserver-xorg-video-ati xserver-xorg-video-nouveau xserver-xorg-video-radeon
*-x86-64-linux-gnu

[drop-vm]
# hardware a virtual machine on a Mac does not have
linux-firmware firmware-sof-signed fwupd fwupd-signed libfwupd2
bluetooth bluez bluez-cups bluez-obexd blueman libspa-0.2-bluetooth
modemmanager libmm-glib0 usb-modeswitch usb-modeswitch-data wireless-tools wpasupplicant rfkill
fingwit libpam-fingwit fprintd libpam-fprintd libfprint-2-2 libfprint-2-tod1
touchegg power-profiles-daemon switcheroo-control pm-utils pcmciautils inputattach irqbalance gamemode
brltty kerneloops nvidia-prime-applet libimobiledevice-utils ideviceinstaller ifuse
hplip hplip-data printer-driver-* openprinting-ppds foomatic-db-compressed-ppds libsane-hpaio
simple-scan sane-utils sane-airscan ipp-usb
mdadm reiserfsprogs

[drop-light]
# heavy or niche applications (all installable later from the Software Manager)
thunderbird* libreoffice* mythes-* hyphen-* hunspell-fr hunspell-de* hunspell-es hunspell-it hunspell-nl hunspell-pt* hunspell-ru hunspell-en-au hunspell-en-ca hunspell-en-gb hunspell-en-za
wbrazilian wbritish wfrench witalian wngerman wogerman wportuguese wspanish wswiss
rhythmbox* libvisual-0.4-plugins hypnotix yt-dlp transmission* warpinator drawing brasero* pix pix-* mintchat onboard onboard-*
mint-l-theme mint-l-icons yaru-theme-* papirus-icon-theme geoip-database libjs-mathjax mesa-vulkan-drivers
nemo-share mintmenu gnome-power-manager redshift redshift-gtk boot-repair boot-sav* glade2script*
# debugging and the C/C++ toolchain (only needed for DKMS drivers, which VMs do not use)
*-dbg gdb ltrace dkms linux-headers-* linux-hwe-*-headers-* gcc gcc-1* g++ g++-1* cpp cpp-1* build-essential
libc6-dev libc-dev-bin linux-libc-dev libstdc++-1*-dev libgcc-1*-dev libasan* libtsan* liblsan* libubsan* libhwasan* libitm1 libcc1-0 libgprofng0 pkg-config manpages-dev dpkg-dev
# extra language packs (the installer fetches the chosen language from the network)
language-pack-de* language-pack-es* language-pack-fr* language-pack-it* language-pack-nl* language-pack-pt* language-pack-ru*
language-pack-gnome-de* language-pack-gnome-es* language-pack-gnome-fr* language-pack-gnome-it* language-pack-gnome-nl* language-pack-gnome-pt* language-pack-gnome-ru*
firefox-locale-*
# Linux Mint's hardware-enablement kernel line with its firmware and headers; replaced below
linux-generic-hwe-24.04 linux-image-generic-hwe-24.04 linux-headers-generic-hwe-24.04 linux-image-6.* linux-modules-6.* linux-modules-extra-6.*
systemd-coredump

[keep]
# kept although their only dependents in the original selection were dropped
apparmor cups cups-browsed cups-filters cups-daemon circle-flags-svg webapp-manager xed xed-common
libfuse2t64 gdisk lshw bc manpages powermgmt-base ssl-cert xserver-xorg-video-fbdev

[add]
# Linux Mint ARM settings and the local package archive that keeps Mint's versions pinned
mint-arm-system
# the same hardware-enablement kernel (7.0 as of this release) in its "virtual" flavour: without the
# firmware for physical hardware
linux-image-virtual-hwe-24.04
# arm64 UEFI boot chain (stays installed; the installer runs grub-install from it)
grub-efi-arm64 grub-efi-arm64-bin grub-efi-arm64-signed shim-signed efibootmgr mokutil
# virtual-machine integration: UTM/QEMU (clipboard, resize, shared folders), VMware Fusion
spice-vdagent spice-webdavd qemu-guest-agent open-vm-tools open-vm-tools-desktop
# compressed RAM swap
systemd-zram-generator
# Firefox from Mozilla's arm64 apt repository
firefox
