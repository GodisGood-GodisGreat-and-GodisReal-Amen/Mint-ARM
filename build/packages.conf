# Linux Mint ARM package selection: one system that runs on a Raspberry Pi 4 or 5 and in virtual
# machines. The starting point is the package manifest of the original Linux Mint 22.3 Cinnamon ISO
# (casper/filesystem.manifest). Lines are package names or shell-style globs; '#' starts a comment.
# Every [drop-*] section removes from that manifest; [keep] and [add] put packages in.
# [remove-on-vm] and [remove-on-pi] are what the system removes at its first start, in a virtual
# machine or on a Raspberry Pi (mint-arm-system's first-start service); a package that something
# kept still needs stays.

[drop-x86]
# x86-only hardware support and the BIOS/x86 boot chain
amd64-microcode intel-microcode iucode-tool thermald
grub-pc grub-pc-bin grub-efi-amd64* grub-gfxpayload-lists syslinux syslinux-utils
i965-va-driver intel-media-va-driver libigdgmm12 libvpl2 libipt2 libquadmath0 libxatracker2 libdrm-intel1
xserver-xorg-video-intel xserver-xorg-video-vmware xserver-xorg-video-qxl xserver-xorg-video-all
xserver-xorg-video-amdgpu xserver-xorg-video-ati xserver-xorg-video-nouveau xserver-xorg-video-radeon
*-x86-64-linux-gnu

[drop-hardware]
# hardware neither a Raspberry Pi nor a virtual machine has (the Pi's own firmware comes in
# linux-firmware-raspi), and firmware updates through UEFI capsules
linux-firmware firmware-sof-signed fwupd fwupd-signed libfwupd2
# mobile broadband, fingerprint readers, touchpad gestures, laptop power profiles and dual graphics
modemmanager libmm-glib0 usb-modeswitch usb-modeswitch-data
fingwit libpam-fingwit fprintd libpam-fprintd libfprint-2-2 libfprint-2-tod1
touchegg power-profiles-daemon switcheroo-control pm-utils pcmciautils inputattach irqbalance gamemode
kerneloops nvidia-prime-applet mdadm reiserfsprogs
# braille displays: brltty also claims the USB serial adapters that boards like the Arduino use
brltty

[drop-live]
# the live session's boot code: the system comes installed, with no live session
casper

[drop-light]
# heavy or niche applications (all installable later from the Software Manager)
thunderbird* libreoffice* mythes-* hyphen-* hunspell-fr hunspell-de* hunspell-es hunspell-it hunspell-nl hunspell-pt* hunspell-ru hunspell-en-au hunspell-en-ca hunspell-en-gb hunspell-en-za
wbrazilian wbritish wfrench witalian wngerman wogerman wportuguese wspanish wswiss
rhythmbox* libvisual-0.4-plugins hypnotix yt-dlp transmission* warpinator drawing brasero* pix pix-* mintchat onboard onboard-*
mint-l-theme mint-l-icons yaru-theme-* papirus-icon-theme geoip-database libjs-mathjax mesa-vulkan-drivers
nemo-share mintmenu gnome-power-manager redshift redshift-gtk boot-repair boot-sav* glade2script*
# debugging and the C/C++ toolchain (only needed for DKMS drivers, which none of its machines use)
*-dbg gdb ltrace dkms linux-headers-* linux-hwe-*-headers-* gcc gcc-1* g++ g++-1* cpp cpp-1* build-essential
libc6-dev libc-dev-bin linux-libc-dev libstdc++-1*-dev libgcc-1*-dev libasan* libtsan* liblsan* libubsan* libhwasan* libitm1 libcc1-0 libgprofng0 pkg-config manpages-dev dpkg-dev
# extra language packs (the installer fetches the chosen language from the network)
language-pack-de* language-pack-es* language-pack-fr* language-pack-it* language-pack-nl* language-pack-pt* language-pack-ru*
language-pack-gnome-de* language-pack-gnome-es* language-pack-gnome-fr* language-pack-gnome-it* language-pack-gnome-nl* language-pack-gnome-pt* language-pack-gnome-ru*
firefox-locale-*
# Linux Mint's hardware-enablement kernel line with its firmware and headers; replaced below by its
# "virtual" flavour and by the Raspberry Pi kernel
linux-generic-hwe-24.04 linux-image-generic-hwe-24.04 linux-headers-generic-hwe-24.04 linux-image-6.* linux-modules-6.* linux-modules-extra-6.*
systemd-coredump

[keep]
# kept although their only dependents in the original selection were dropped
apparmor cups cups-browsed cups-filters cups-daemon circle-flags-svg webapp-manager xed xed-common
libfuse2t64 gdisk lshw bc manpages powermgmt-base ssl-cert xserver-xorg-video-fbdev

[add]
# Linux Mint ARM settings: shared, for virtual machines, for the Raspberry Pi
mint-arm-system mint-arm-vm mint-arm-pi
# compressed RAM swap
systemd-zram-generator
# Firefox from Mozilla's arm64 apt repository
firefox
# Virtual machines. The same hardware-enablement kernel (7.0 as of this release) in its "virtual"
# flavour, without the firmware for physical hardware; the arm64 UEFI boot chain; UTM/QEMU
# integration (clipboard, resizing, shared folders, the guest agent) and VMware Fusion's tools
linux-image-virtual-hwe-24.04
grub-efi-arm64 grub-efi-arm64-bin grub-efi-arm64-signed shim-signed efibootmgr mokutil
spice-vdagent spice-webdavd qemu-guest-agent open-vm-tools open-vm-tools-desktop
# The Raspberry Pi. Ubuntu's Raspberry Pi kernel (6.8) with only the Pi's firmware: its boot files,
# Wi-Fi and Bluetooth for every Pi 4 and Pi 5 model (linux-firmware-minimal stands in for Ubuntu's
# full firmware set, which the kernel asks for); flash-kernel, which puts each new kernel on the
# boot partition (it calls mkimage); Ubuntu's Raspberry Pi desktop settings, and growing the system
# to fill the card (or the virtual disk) on the first start; bootloader (EEPROM) updates, vcgencmd,
# the Pi 5's power-supply warnings
linux-image-raspi linux-firmware-minimal linux-firmware-raspi
flash-kernel u-boot-tools
ubuntu-raspi-settings-desktop cloud-initramfs-growroot
rpi-eeprom libraspberrypi-bin pemmican-desktop

[remove-on-vm]
# in a virtual machine: everything only the Raspberry Pi uses
mint-arm-pi linux-image-raspi linux-image-*-raspi linux-modules-*-raspi linux-firmware-raspi
flash-kernel u-boot-tools ubuntu-raspi-settings ubuntu-raspi-settings-desktop cloud-initramfs-growroot
rpi-eeprom rpi-eeprom-firmware libraspberrypi-bin libraspberrypi0 pemmican-desktop pemmican-common
# and the hardware support a virtual machine on a Mac has no use for
bluetooth bluez bluez-cups bluez-obexd blueman libspa-0.2-bluetooth wireless-tools wpasupplicant rfkill
libimobiledevice-utils ideviceinstaller ifuse
hplip hplip-data printer-driver-* openprinting-ppds foomatic-db-compressed-ppds libsane-hpaio
simple-scan sane-utils sane-airscan ipp-usb

[remove-on-pi]
# on a Raspberry Pi: everything only virtual machines use (the Pi's firmware starts the kernel itself)
mint-arm-vm linux-image-virtual-hwe-24.04 linux-image-*-generic linux-image-unsigned-*-generic
linux-modules-*-generic linux-main-modules-*-generic linux-modules-extra-*-generic
shim-signed grub-efi-arm64* grub-common grub2-common os-prober efibootmgr mokutil sbsigntool secureboot-db
spice-vdagent spice-webdavd qemu-guest-agent open-vm-tools open-vm-tools-desktop
