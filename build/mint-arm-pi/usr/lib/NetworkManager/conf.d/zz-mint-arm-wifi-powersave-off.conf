# Linux Mint ARM: no Wi-Fi power saving on the Raspberry Pi's built-in chip, which keeps connections
# steady. Ubuntu's Raspberry Pi settings mean to do the same (ZZraspi-wifi-powersave-off.conf), but
# NetworkManager reads its files in byte order, so its own default-wifi-powersave-on.conf came
# after and won; this name comes after both.
[connection]
wifi.powersave = 2
