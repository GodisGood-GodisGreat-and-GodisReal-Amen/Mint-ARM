# Linux Mint ARM (mint-arm-vm): the kernel's console is the VM's screen, as on a PC. The firmware
# of QEMU's and UTM's virtual machines otherwise names their serial port as the console: Linux
# Mint's start-up splash then stays off, and an encrypted disk asks for its passphrase on that
# serial port, which UTM does not show.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT console=tty1"
