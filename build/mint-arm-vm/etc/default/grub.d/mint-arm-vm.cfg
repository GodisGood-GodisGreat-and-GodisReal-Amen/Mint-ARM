# Linux Mint ARM (mint-arm-vm): on a system with an encrypted disk, the kernel's console is the VM's
# screen (console=tty1), as on a PC, so that the passphrase prompt at each start shows there. The
# firmware of QEMU's and UTM's virtual machines otherwise names their serial port as the console,
# which UTM does not show. Other systems keep the firmware's console and start about 0.15 s sooner,
# without Linux Mint's start-up splash (which the screen console brings). Encrypted means that
# /etc/crypttab names a device, or that one is open, as during the installation before
# /etc/crypttab is written. After encrypting a disk later, run "sudo update-grub" once.
if grep -Eqsv '^[[:space:]]*(#|$)' /etc/crypttab \
   || dmsetup ls --target crypt 2> /dev/null | grep -qv '^No devices found'; then
  GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT console=tty1"
fi
